<!DOCTYPE html>
<html lang="pt-br">

    <title>Imersão da Alura</title>
</head>
<body>
   <header>

            <h1>Imersão Dev Alura - Google Gemini</h1>

                <input type="text" placeholder="Digite uma Linguagem de programação válida">
                <button id="botao-busca" onclick="iniciarBusca()">Buscar</button>
            </div>
        </div>
        <nav class="main-nav">

            <button id="tab-exemplos" class="nav-tab">Exemplos</button>

    <main>
        <section id="page-linguagens" class="page-content active">
            <div class="card-container"></div>
        </section>

        <section id="page-exemplos" class="page-content">
            <div class="exemplos-container"></div>
        </section>
    </main>

    <footer class="footer">

            <li><a href="https://github.com/GGneto10">Github</a></li>
            <li><a href="https://www.linkedin.com/in/geraldo-gomes-de-oliveira-neto-4760961b6/">Linkedin</a></li>
